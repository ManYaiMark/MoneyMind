{% extends 'expenses/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-center mb-3">ลืมรหัสผ่าน?</h4>
                    <p class="text-muted text-center small">กรอกอีเมลที่ใช้สมัครบัญชีนี้ แล้วระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้</p>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }} 
                        <button type="submit" class="btn btn-primary w-100 mt-3">ส่งลิงก์ไปที่อีเมล</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
