{% extends 'expenses/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="fw-bold text-center mb-3">ตั้งรหัสผ่านใหม่</h4>
                    
                    {% if validlink %}
                        <form method="POST">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-danger w-100 mt-3">บันทึกรหัสผ่านใหม่</button>
                        </form>
                    {% else %}
                        <div class="alert alert-danger text-center" role="alert">
                            ลิงก์นี้หมดอายุหรือถูกใช้งานไปแล้ว กรุณาขอลิงก์ใหม่อีกครั้ง
                        </div>
                        <div class="text-center mt-3">
                            <a href="{% url 'reset_password' %}" class="btn btn-primary">ขอลิงก์ใหม่</a>
                        </div>
                    {% endif %}
                    
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
