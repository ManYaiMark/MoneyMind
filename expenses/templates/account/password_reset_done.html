    <div class="row justify-content-center">
        <div class="col-md-6 text-center">

                <div class="card-body p-5">
                    <h1 class="text-success mb-3"><i class="bi bi-envelope-check-fill"></i></h1>
                    <h4 class="fw-bold">ส่งอีเมลเรียบร้อย!</h4>

            </div>
