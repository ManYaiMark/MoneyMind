<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Modal Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        /* สไตล์สำหรับ Tag ที่เพิ่มเข้าไป */
        .keyword-chip {
            font-size: 0.9rem;
            margin: 2px;
            padding-right: 0; /* เพื่อให้ปุ่ม X ชิดขวา */
        }
        .keyword-chip .btn-close {
            font-size: 0.7rem;
            margin-left: 8px;
            padding: 0.5rem;
        }
    </style>
</head>
<body class="p-5">

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addGlobalModal">
        ทดสอบเปิด Modal
    </button>

    <div class="modal fade" id="addGlobalModal" tabindex="-1">
        <div class="modal-dialog modal-lg"> <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">📂 จัดการหมวดหมู่และ AI Keywords</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="globalCategoryForm">
                        <h6 class="fw-bold text-muted mb-3">ข้อมูลทั่วไป</h6>
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">ชื่อหมวดหมู่</label>
                                <input type="text" class="form-control" placeholder="เช่น อาหาร, เดินทาง">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">ประเภท</label>
                                <select class="form-select">
                                    <option value="EXPENSE">รายจ่าย</option>
                                    <option value="INCOME">รายรับ</option>
                                </select>
                            </div>
                        </div>

                        <hr>

                        <h6 class="fw-bold text-muted mb-3">
                            <i class="bi bi-robot me-1"></i> AI Training Data
                        </h6>
                        <div class="mb-3">
                            <label class="form-label">เพิ่มคำค้นหา (Keywords)</label>
                            <div class="input-group mb-2">
                                <input type="text" id="keywordInput" class="form-control" placeholder="พิมพ์คำศัพท์ แล้วกด Enter หรือปุ่มเพิ่ม">
                                <button class="btn btn-secondary" type="button" id="addKeywordBtn">
                                    <i class="bi bi-plus-lg me-1"></i>เพิ่ม
                                </button>
                            </div>
                            <div class="form-text text-muted mb-3">
                                เช่น: ถ้าหมวดอาหาร ให้ใส่ "7-11", "ข้าวแกง", "MK"
                            </div>

                            <div id="keywordChipsContainer" class="d-flex flex-wrap gap-2 p-3 bg-light rounded border" style="min-height: 60px;">
                                </div>

                            <input type="hidden" name="final_keywords" id="hiddenKeywordString">
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary px-4" onclick="saveData()">บันทึกการเปลี่ยนแปลง</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const keywordInput = document.getElementById('keywordInput');
        const addKeywordBtn = document.getElementById('addKeywordBtn');
        const chipsContainer = document.getElementById('keywordChipsContainer');
        const hiddenInput = document.getElementById('hiddenKeywordString');
        
        let keywords = []; // ตัวแปรเก็บรายการคำศัพท์ชั่วคราวใน JS

        // ฟังก์ชัน: เพิ่ม Keyword เข้าไปในรายการ
        function addKeyword(word) {
            word = word.trim();
            // เช็คว่าคำว่างเปล่า หรือซ้ำกับที่มีอยู่แล้วหรือไม่
            if (word && !keywords.includes(word)) {
                keywords.push(word);
                renderChips();
                keywordInput.value = ''; // เคลียร์ช่องพิมพ์
            }
        }

        // ฟังก์ชัน: ลบ Keyword ออก
        function removeKeyword(wordToDelete) {
            keywords = keywords.filter(word => word !== wordToDelete);
            renderChips();
        }

        // ฟังก์ชัน: วาด Chips (Tags) ขึ้นมาแสดงบนหน้าจอ
        function renderChips() {
            chipsContainer.innerHTML = ''; // ล้างของเก่าก่อน
            keywords.forEach(word => {
                // สร้าง HTML ของปุ่ม Tag
                const chip = document.createElement('span');
                chip.className = 'badge bg-success bg-opacity-75 text-white rounded-pill keyword-chip d-flex align-items-center ps-3 pe-1 py-2';
                chip.innerHTML = `
                    ${word}
                    <button type="button" class="btn-close btn-close-white" aria-label="Remove" onclick="removeKeyword('${word}')"></button>
                `;
                chipsContainer.appendChild(chip);
            });
            
            // อัปเดตค่าลงใน Input ซ่อน (คั่นด้วยลูกน้ำ) เตรียมส่งหลังบ้าน
            hiddenInput.value = keywords.join(',');
            // console.log("Current Keywords to send:", hiddenInput.value); // เอาไว้ดูใน Console
        }

        // --- Event Listeners (ดักจับเหตุการณ์) ---

        // 1. เมื่อกดปุ่ม "เพิ่ม"
        addKeywordBtn.addEventListener('click', () => {
            addKeyword(keywordInput.value);
        });

        // 2. เมื่อกดปุ่ม "Enter" ในช่องพิมพ์
        keywordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault(); // ป้องกันไม่ให้ Form submit
                addKeyword(keywordInput.value);
            }
        });

        // ฟังก์ชันจำลองการกด Save (ดูผลลัพธ์ใน Console)
        function saveData() {
            const finalData = hiddenInput.value;
            if (!finalData) {
                alert("กรุณาเพิ่ม Keyword อย่างน้อย 1 คำ");
                return;
            }
            alert("กำลังจะบันทึก Keywords: \n" + finalData);
            // ของจริงตรงนี้จะเป็นการ Submit Form ไปหา Django View
            // document.getElementById('globalCategoryForm').submit();
        }
    </script>
</body>
</html>
